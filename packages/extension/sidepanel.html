<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OiU — AURA Meeting Awareness Copilot</title>
    <!-- AURA Typography: Plus Jakarta Sans + Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --aura-bg: #FAF9F6;
        --aura-plum: #3A233F;
        --aura-lavender: #BDA7E8;
        --aura-peach: #FFD5C2;
        --aura-sage: #87BBA2;
        --aura-border: #E5DFEC;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--aura-bg);
        color: var(--aura-plum);
        width: 100vw;
        height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* AURA Soft Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D9D2E2;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #BDA7E8;
      }
      /* Interactive Focus & Press Feedback */
      button {
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible, input:focus-visible {
        outline: 2px solid var(--aura-lavender);
        outline-offset: 2px;
      }
      button:active {
        transform: scale(0.985);
      }
      /* AURA Motion & Micro-animations */
      @keyframes auraBreathing {
        0% {
          transform: scale(0.975);
          box-shadow: 0 0 22px rgba(189, 167, 232, 0.35), 0 0 48px rgba(255, 213, 194, 0.22);
        }
        50% {
          transform: scale(1.025);
          box-shadow: 0 0 36px rgba(189, 167, 232, 0.55), 0 0 72px rgba(255, 213, 194, 0.38);
        }
        100% {
          transform: scale(0.975);
          box-shadow: 0 0 22px rgba(189, 167, 232, 0.35), 0 0 48px rgba(255, 213, 194, 0.22);
        }
      }
      @keyframes auraPulseRing {
        0% {
          transform: scale(0.94);
          opacity: 0.75;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.3;
        }
        100% {
          transform: scale(0.94);
          opacity: 0.75;
        }
      }
      @keyframes auraAlertPulse {
        0% {
          transform: scale(0.98);
          box-shadow: 0 0 22px rgba(226, 109, 92, 0.35), 0 0 46px rgba(255, 213, 194, 0.4);
        }
        50% {
          transform: scale(1.035);
          box-shadow: 0 0 40px rgba(226, 109, 92, 0.58), 0 0 76px rgba(255, 213, 194, 0.52);
        }
        100% {
          transform: scale(0.98);
          box-shadow: 0 0 22px rgba(226, 109, 92, 0.35), 0 0 46px rgba(255, 213, 194, 0.4);
        }
      }
      @keyframes auraCardEnter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes auraFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .aura-card-enter {
        animation: auraCardEnter 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .aura-interactive-card {
        transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.16s ease, border-color 0.16s ease !important;
      }
      .aura-interactive-card:hover {
        transform: translateY(-1.5px);
        box-shadow: 0 4px 16px rgba(58, 35, 63, 0.08) !important;
        border-color: #BDA7E8 !important;
      }
      .aura-interactive-card:active {
        transform: translateY(0);
      }
      .aura-chip {
        transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.14s ease, border-color 0.14s ease !important;
      }
      .aura-chip:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 8px rgba(58, 35, 63, 0.07);
      }
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/sidepanel/main.tsx"></script>
  </body>
</html>
